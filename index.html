<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zhiyu Zhang · Homepage</title>
  <meta name="description" content="Zhiyu Zhang (章之禹) — PhD student working on generative video-audio and speech models." />

  <!-- Set theme before paint to avoid flash -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
        var l = localStorage.getItem('lang');
        if (l) document.documentElement.setAttribute('lang', l);
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/style.css?v=31" />
</head>
<body>
  <div class="bg-fx" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow--1"></div>
    <div class="bg-glow bg-glow--2"></div>
  </div>

  <!-- Navbar -->
  <header class="nav" id="nav">
    <div class="nav__inner container">
      <a href="#top" class="nav__brand" data-nav="brand">Zhiyu Zhang</a>

      <nav class="nav__links" id="navLinks" aria-label="Primary">
        <a href="#about" data-nav="about">About</a>
        <a href="#news" data-nav="news">News</a>
        <a href="#techreport" data-nav="techreport">Technical Report</a>
        <a href="#publications" data-nav="publications">Publications</a>
        <a href="#experience" data-nav="experience">Experience</a>
        <a href="#honors" data-nav="honors">Honors</a>
        <a href="#education" data-nav="education">Education</a>
        <a href="#contact" data-nav="contact">Contact</a>
      </nav>

      <div class="nav__actions">
        <button class="btn-icon" id="langToggle" type="button" aria-label="Toggle language">
          <span data-ui="langLabel">中文</span>
        </button>
        <button class="btn-icon" id="themeToggle" type="button" aria-label="Toggle theme">
          <span class="theme-ico" aria-hidden="true"></span>
        </button>
        <button class="btn-icon nav__burger" id="navBurger" type="button" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main id="top">
    <!-- Hero -->
    <section class="hero" id="hero">
      <div class="container hero__inner">
        <div class="hero__text reveal">
          <p class="hero__eyebrow" data-hero="eyebrow"></p>
          <h1 class="hero__name">
            <span data-hero="name"></span>
            <span class="hero__cn" data-hero="cnName"></span>
          </h1>
          <p class="hero__tagline" data-hero="tagline"></p>
          <p class="hero__meta">
            <span class="dot"></span><span data-hero="affiliation"></span>
            <span class="sep">·</span><span data-hero="location"></span>
          </p>
          <ul class="hero__keywords" id="heroKeywords"></ul>
          <div class="hero__cta">
            <a class="btn btn--primary" id="ctaPrimary" href="#publications"></a>
            <a class="btn btn--ghost" id="ctaSecondary" href="#contact"></a>
          </div>
          <ul class="hero__socials" id="heroSocials"></ul>
        </div>
        <div class="hero__avatar reveal">
          <div class="avatar-frame">
            <img id="avatarImg" alt="Zhiyu Zhang" src="./assets/img/portrait.png" />
          </div>
        </div>
      </div>
      <a class="scroll-hint" href="#about" aria-hidden="true"><span></span></a>
    </section>

    <!-- Content sections rendered by JS -->
    <section class="section" id="about"><div class="container" id="aboutBlock"></div></section>
    <section class="section" id="news"><div class="container" id="newsBlock"></div></section>
    <section class="section" id="techreport"><div class="container" id="techReportBlock"></div></section>
    <section class="section" id="publications"><div class="container" id="publicationsBlock"></div></section>
    <section class="section" id="experience"><div class="container" id="experienceBlock"></div></section>
    <section class="section" id="honors"><div class="container" id="honorsBlock"></div></section>
    <section class="section" id="education"><div class="container" id="educationBlock"></div></section>
    <section class="section" id="contact"><div class="container" id="contactBlock"></div></section>
    <section class="section" id="browsing"><div class="container" id="browsingBlock"></div></section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span data-footer="copyright"></span>
    </div>
  </footer>

  <a href="#top" class="to-top" id="toTop" aria-label="Back to top"></a>

  <script src="./assets/js/worldmap.js?v=31"></script>
  <script src="./assets/js/globe.js?v=31"></script>
  <script src="./assets/js/main.js?v=31"></script>
</body>
</html>
