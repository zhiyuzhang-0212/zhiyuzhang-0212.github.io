name = "zzy-browsing-log"
main = "worker.js"
compatibility_date = "2024-11-01"

# Serve the Worker from a custom domain on the zhiyuzhang.com zone
# (better China reachability than *.workers.dev). Wrangler provisions
# the DNS record + edge certificate on deploy.
routes = [
  { pattern = "api.zhiyuzhang.com", custom_domain = true }
]

# D1 database holding the visitor log (schema: migrations/0001_init.sql).
# The KV namespace the log used to live in (379b732a330c4803b6dda1c6a64d2211) is no
# longer bound; it is left untouched as a backup of the pre-D1 data.
[[d1_databases]]
binding = "DB"
database_name = "zzy-visitors"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "migrations"
